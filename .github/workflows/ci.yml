name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  PYTHON_VERSION: "3.10"

jobs:
  test:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          # openai-whisper se importa de forma perezosa (solo hace falta en
          # runtime para transcribir audio) y su build rompe el install en CI:
          # los tests no lo necesitan.
          grep -v "openai-whisper" backend/requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
      - name: Run tests
        run: pytest tests/ -q --cov=backend --cov-report=term
